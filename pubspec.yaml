name: prezentare_interactiva
description: Sistem de prezentare pentru table interactive
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core:     ^2.27.0
  firebase_database: ^10.4.0

  # UI & Animații
  flutter_animate:   ^4.5.0
  go_router:         ^13.0.0

  # Web (iFrame Canva / Google Slides)
  webview_flutter:         ^4.7.0
  webview_flutter_web:     ^0.2.2

  # Audio
  audioplayers:      ^6.0.0

  # Utilitare
  shared_preferences: ^2.2.0
  connectivity_plus:  ^6.0.0
  flutter_bloc:       ^8.1.4
  equatable:          ^2.0.5

  web: ^1.0.0
  video_player: ^2.9.2
  video_player_web: ^2.3.2
  cloud_firestore: ^4.17.5  # ^5.x cere firebase_core ^3.x, incompatibil cu ^2.27.0 de mai sus
  just_audio: ^0.10.5        # playere audio pe Web (HTMLAudioElement): seek, volum, buclă — control
  hive_ce: ^2.11.0           # persistență în IndexedDB (fork întreținut al Hive; LazyBox pentru fișiere mari)
  hive_ce_flutter: ^2.3.0    #   Hive.initFlutter()
  file_selector: ^1.0.3      # selector de fișiere multiple, oficial Flutter, API stabil pe Web
  desktop_drop: ^0.8.1       # drag & drop de fișiere (Web + desktop)
  http: ^1.2.0

  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.1


flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/sound_video/