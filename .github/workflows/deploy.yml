name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main 

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    # 1. Schimbat de la ubuntu-latest la ubuntu-24.04 pentru stabilitate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # (Vezi nota de mai jos despre versiuni)

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/Prezzentare/"

      - name: Upload artifact
        # 2. Poți încerca actualizarea la v4 dacă este disponibilă, pentru a rula nativ pe Node.js 24
        uses: actions/upload-pages-artifact@v3 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
